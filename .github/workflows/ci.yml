name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:npm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: CLI runs on the oldest supported Node
        run: node dist/npm/dist/cli.js --help
